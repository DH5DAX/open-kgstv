[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "open-kgstv"
version = "0.1.0"
description = "An independent Python implementation of the KG-STV digital image protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "Pillow>=10"]

[project.optional-dependencies]
audio = ["av>=12"]
live = ["sounddevice>=0.5", "pyserial>=3.5"]

[project.scripts]
kgstv = "kgstv.cli:main"

[project.gui-scripts]
kgstv-gui = "kgstv.gui:main"

[tool.setuptools.packages.find]
include = ["kgstv*"]
